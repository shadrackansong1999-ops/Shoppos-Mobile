name: shoppos_mobile
description: ShopPOS Mobile - offline-first point of sale with cloud sync.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local offline database (raw SQL - no code generation required)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Networking / cloud sync
  http: ^1.2.1
  connectivity_plus: ^6.0.3

  # State management (plain ChangeNotifier - no code generation)
  provider: ^6.1.2

  # Session + local prefs
  shared_preferences: ^2.2.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
